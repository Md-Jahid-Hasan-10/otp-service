server:
  port: 8086
management:
  server:
    port: 18086
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        api.calls: true
        kafka.consume: true
        client.calls: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
spring:
  application:
    name: otp-service
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis2188}
      timeout: 2s
      connect-timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: otp-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: 3
      observation-enabled: true
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 0
        # max.block.ms must be at least as long as delivery.timeout.ms, and
        # the publisher waits longer than both. Otherwise a publish can be
        # reported as failed while the message is still on its way, and the
        # retry sends it a second time.
        max.block.ms: 15000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    template:
      observation-enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  notification:
    base-url: http://notification-service
  otp:
    expiry-minutes: 5
    max-attempts: 3
    resend-cooldown-seconds: 30
    hash-secret: ${OTP_HASH_SECRET:ba9993fb48999f6b4b9e249235ed108f9864de5c905f53b91b9294cb3eab5b08}
    log-dev-otp: ${OTP_LOG_DEV:false}
  messaging:
    producer-name: otp-service
    crypto-key: ${EVENT_CRYPTO_KEY:pxUXlFhqre/31HUOw+mT9Oz80+rJz33fRtXx/kcGeTk=}
  observability:
    log-bodies: true
    max-body-length: 2048

logging:
  structured:
    format:
      file: logstash
    json:
      add:
        service: ${spring.application.name}
  file:
    name: ${BANKING_LOG_DIR:${user.home}/banking-logs}/${spring.application.name}.json
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 200MB