server:
  port: 8086

spring:
  application:
    name: otp-service
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  notification:
    base-url: http://notification-service
  otp:
    expiry-minutes: 5
    max-attempts: 3
    resend-cooldown-seconds: 30
    hash-secret: ${OTP_HASH_SECRET:local-dev-otp-hash-secret-change-me-please}
    log-dev-otp: ${OTP_LOG_DEV:false}