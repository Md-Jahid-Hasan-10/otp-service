server:
  port: 8086
management:
  server:
    port: 18083
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
spring:
  application:
    name: otp-service
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: otp-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: 3
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 0
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  notification:
    base-url: http://notification-service
  otp:
    expiry-minutes: 5
    max-attempts: 3
    resend-cooldown-seconds: 30
    hash-secret: ${OTP_HASH_SECRET:ba9993fb48999f6b4b9e249235ed108f9864de5c905f53b91b9294cb3eab5b08}
    log-dev-otp: ${OTP_LOG_DEV:false}
  messaging:
    producer-name: otp-service
    crypto-key: ${EVENT_CRYPTO_KEY:pxUXlFhqre/31HUOw+mT9Oz80+rJz33fRtXx/kcGeTk=}